[package]
name = "weft_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "weft_core"

[dependencies]
flume = "0.11"
futures-util = "0.3"
local-ip-address = "0.6"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }
